name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Lean and restore Mathlib
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      # Suggested.lean states goals and may use sorry. It does not share the
      # content repository's axiom audit or warning-as-error policy.
      - run: lake build
