name = "ExampleCeti"
defaultTargets = ["ExampleCeti"]
platformIndependent = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"

[[lean_lib]]
name = "ExampleCeti"
globs = ["ExampleCeti.*"]

[[lean_exe]]
name = "axioms"
root = "scripts.Axioms"

[[lean_exe]]
name = "module-system"
root = "scripts.ModuleSystem"
